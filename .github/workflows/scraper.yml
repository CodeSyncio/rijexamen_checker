name: Rijexamen Scraper

on:
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run Scraper
        env:
          # Deze namen links moeten EXACT matchen met de os.environ.get() in je Python-code
          RIJEXAMEN_USER: ${{ secrets.RIJEXAMEN_USER }}
          RIJEXAMEN_PASS: ${{ secrets.RIJEXAMEN_PASS }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CENTER_ID: ${{ secrets.CENTER_ID }}
          SERVICE_ID: ${{ secrets.SERVICE_ID }}
          CANDIDATE_ID: ${{ secrets.CANDIDATE_ID }}
        run: python scraper.py